    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cSHblox | Premium Game Client</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: {
                        roblox: { dark: '#0f1014', card: '#181a20', primary: '#00b0f0', accent: '#7289da' }
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 0.5s ease-out forwards',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0b0c10;
            color: #ffffff;
            overflow: hidden;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f1014; }
        ::-webkit-scrollbar-thumb { background: #2a2d3a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #3f4458; }
        
        .glass {
            background: rgba(24, 26, 32, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .glass-search {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }
        .glass-search:focus-within {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(0, 176, 240, 0.5);
            box-shadow: 0 0 15px rgba(0, 176, 240, 0.2);
        }

        .game-card {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .game-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.15);
        }
        .play-overlay {
            opacity: 0;
            transition: all 0.3s ease;
        }
        .game-card:hover .play-overlay {
            opacity: 1;
        }

        .gradient-text {
            background: linear-gradient(135deg, #00b0f0, #7289da);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Ambient Background Glow */
        .ambient-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 176, 240, 0.15) 0%, rgba(0,0,0,0) 70%);
            top: -300px;
            left: -300px;
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }

            return `
                <div class="game-card glass rounded-2xl overflow-hidden cursor-pointer flex flex-col h-full border border-white/5 group opacity-0 animate-fade-in-up" 
                     style="animation-delay: ${delay}ms;"
                     onclick="launchGame(${game.id})">
                    
                    <!-- Thumbnail Area -->
                    <div class="relative w-full aspect-square" style="background: ${gradient};">
                        <div class="absolute inset-0 flex items-center justify-center">
                            <span class="text-4xl font-bold text-white/40 tracking-widest">${initials}</span>
                        </div>
                        
                        <!-- Top Badges -->
                        <div class="absolute top-3 right-3 bg-black/60 backdrop-blur-md px-2 py-1 rounded-md flex items-center gap-1">
                            <i data-lucide="users" class="w-3 h-3 text-green-400"></i>
                            <span class="text-xs font-bold text-white">${game.players}</span>
                        </div>

                        <!-- Hover Play Overlay -->
                        <div class="play-overlay absolute inset-0 bg-black/40 backdrop-blur-[2px] flex items-center justify-center">
                            <div class="w-14 h-14 bg-roblox-primary rounded-full flex items-center justify-center shadow-[0_0_20px_rgba(0,176,240,0.6)] transform group-hover:scale-110 transition-transform duration-300">
                                <i data-lucide="play" class="w-6 h-6 text-white ml-1"></i>
                            </div>
                        </div>
                    </div>

                    <!-- Info Area -->
                    <div class="p-4 flex flex-col flex-1 bg-gradient-to-b from-transparent to-black/40">
                        <h3 class="text-white font-bold text-lg leading-tight mb-1 truncate" title="${game.name}">${game.name}</h3>
                        <p class="text-gray-400 text-xs mb-3 truncate">By ${game.dev}</p>
                        
                        <div class="mt-auto flex items-center justify-between">
                            <span class="text-xs font-semibold px-2 py-1 rounded-md bg-white/10 text-gray-300 border border-white/5">
                                ${game.genre}
                            </span>
                            <div class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center group-hover:bg-roblox-primary/20 group-hover:text-roblox-primary transition-colors">
                                <i data-lucide="external-link" class="w-4 h-4"></i>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Render Games Grid
        function renderGames() {
            const filtered = gamesList.filter(game => {
                const matchesGenre = currentFilter === "All" || game.genre === currentFilter;
                const matchesSearch = game.name.toLowerCase().includes(currentSearch.toLowerCase()) || 
                                      game.dev.toLowerCase().includes(currentSearch.toLowerCase());
                return matchesGenre && matchesSearch;
            });

            gameCount.innerText = filtered.length;
            
            if (filtered.length === 0) {
                gameGrid.innerHTML = "";
                emptyState.classList.remove("hidden");
                emptyState.classList.add("flex");
            } else {
                emptyState.classList.add("hidden");
                emptyState.classList.remove("flex");
                gameGrid.innerHTML = filtered.map((game, i) => createGameCard(game, i)).join("");
                lucide.createIcons();
            }
        }

        // Global Action Functions
        window.setGenre = function(filter, name) {
            currentFilter = filter;
            categoryTitle.innerText = name;
            renderGenres();
            renderGames();
            document.getElementById("mainScroll").scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.launchGame = function(id) {
            const url = `https://www.roblox.com/games/${id}`;
            if (window.cshblox?.launchGame) {
                window.cshblox.launchGame(id);
            } else {
                window.open(url, '_blank');
            }
        }

        // Search Handlers
        searchInput.addEventListener("input", (e) => {
            currentSearch = e.target.value;
            clearSearchBtn.classList.toggle("hidden", currentSearch.length === 0);
            
            // If searching globally, maybe reset genre to All visually (optional, but good UX)
            if (currentSearch.length > 0 && currentFilter !== "All") {
                currentFilter = "All";
                categoryTitle.innerText = "Search Results";
                renderGenres();
            } else if (currentSearch.length === 0) {
                categoryTitle.innerText = genres.find(g => g.filter === currentFilter).name;
            }

            renderGames();
        });

        clearSearchBtn.addEventListener("click", () => {
            searchInput.value = "";
            currentSearch = "";
            clearSearchBtn.classList.add("hidden");
            categoryTitle.innerText = genres.find(g => g.filter === currentFilter).name;
            renderGames();
        });

        // Initialize
        renderGenres();
        renderGames();

    </script>
</body>
</html>
